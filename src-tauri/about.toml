# cargo-about configuration for THIRD_PARTY_NOTICES
# (see scripts/generate-third-party-notices.sh). Only the macOS app's
# runtime dependency graph is listed.
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "BSD-1-Clause",
  "NCSA",
]

# hushtype itself is proprietary (publish = false) and is not listed.
private = { ignore = true }

# tauri-nspanel ships MIT and Apache-2.0 license files but no license field.
[tauri-nspanel.clarify]
license = "MIT OR Apache-2.0"

[[tauri-nspanel.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "35e740d8a0d71739293b136b9f289c6b05f21ff6b0584b9b691dd5de5233d7e8"

[[tauri-nspanel.clarify.files]]
path = "LICENSE_APACHE-2.0"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
